<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      .head {
        width: 100%;
        height: 100px;
        border: 1px solid black;
        background-color: aqua;
        display: flex;
        justify-content: center;
      }
      .box {
        width: 100%;
        height: 100px;
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        flex-wrap: wrap;
        padding-left: 100px;
        gap: 8px;
      }

      .small {
        width: 180px;
        height: 55px;
        border-radius: 8px;
        border: 2px solid black;
        display: flex;
        margin: 0px;
        padding-left: 5px;
      }
      .big {
        width: 350px;
        height: 55px;
        border-radius: 8px;
        border: 2px solid black;
        margin: 0px;
      }

      .mid {
        width: 270px;
        height: 55px;
        border-radius: 10px;
        border: 2px solid black;
      }

      .verysmall {
        width: 200px;
        height: 50px;
        border: 1px solid black;
        border-radius: 10px;
        background-color: rgb(78, 78, 226);
        margin-left: 20px;
      }

      .list {
        width: 80%;
        height: 900px;
        border: 2px solid black;
        border-radius: 20px;

        display: flex;
        align-items: flex-start;

        padding: 20px;
        margin: 60px auto;

        gap: 20px;
      }

      .box1 {
        width: 40%;
        height: 400px;
        border: 2px solid black;
        border-radius: 15px;
      }

      .right {
        width: 30%;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .box2,
      .box3 {
        width: 100%;
        height: 200px;
        border: 2px solid black;
        border-radius: 15px;
        padding: 20px;
      }

      .date{
        width: 30%;
        height: 100px;
        border: 2px solid black;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 40 0 0 40px;
      }

      .select{
        width: 90%;
        height: 50px;
        border: 2px solid black;
        border-radius: 5px;
        display: flex;
        justify-content: center;
        align-items: center;
         margin: 0;
         padding: 0;
      }
      
      /* .review{
        width: 30%;
        height: 100px;
        border: 2px solid black;

      } */
    </style>
  </head>
  <body>
    <div class="head">
      <p>Header</p>
    </div>

    <div class="box">
      <div class="big"></div>
      <div class="small"></div>
      <div class="small"></div>
      <div class="mid"></div>
      <div class="verysmall"></div>
    </div>

    <div class="list">
      <div class="box1"></div>

      <div class="right">
        <div class="box2"></div>
        <div class="box3"></div>
      </div>

      <div class="date">
        <div class="select"></div>
      </div>

      <div class="review"></div>
    </div>
  </body>
</html>
