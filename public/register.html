<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registeration Form</title>
    <link rel="stylesheet" href="/register.css" />
  </head>
  <body>
    <form action="/register" method="post">
      <h1>Create your profile</h1>
      <p>Search & apply to jobs from India's No.1 Job Site</p>

      <label for="name">Full name:</label><br /><br />
      <input
        type="text"
        id="name"
        name="name"
        placeholder="What is your name?"
        required
      />
      <br /><br />

      <label for="email">Email ID:</label><br /><br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Tell us your Email ID"
        required
      />
      <br /><br />

      <label for="password">Password:</label><br /><br />
      <div class="password-box">
        <input
          type="password"
          id="password"
          name="password"
          placeholder="(Minimum 6 characters)"
          required
        />

        <span class="eye" id="eye" onclick="showPassword()">👁</span>
      </div>
      <br /><br />

      <label for="confirm">Confirm Password:</label><br /><br />

      <div class="password-box">
        <input
          type="password"
          id="confirm"
          name="confirm"
          placeholder="Confirm password"
          required
        />
        <span class="eye" id="eye2" onclick="showConfirmPassword()">👁</span>
      </div>

      <br /><br />

      <label for="mobile">Mobile number:</label><br /><br />
      <span id="ind">+91</span>
      <input
        type="tel"
        id="mobile"
        name="mobile"
        placeholder="Enter your mobile number"
        maxlength="10"
        required
      />
      <br /><br />

      <label for="date">Date of birth:</label><br /><br />
      <input type="date" id="date" name="date" required /><br /><br />

      <label for="file">File:</label><br /><br />
      <input type="file" id="file" name="file" required /><br /><br />

      <button type="submit" id="btt">Register now</button>
    </form>

    <script>
      function showPassword() {
        let password = document.getElementById("password");
        let eye = document.getElementById("eye");

        if (password.type === "password") {
          eye.textContent = "❌";
          password.type = "text";
        } else {
          password.type = "password";
          eye.textContent = "👁";
        }
      }

      function showConfirmPassword() {
        let confirm = document.getElementById("confirm");
        let eye2 = document.getElementById("eye2");

        if (confirm.type === "password") {
          eye2.textContent = "❌";
          confirm.type = "text";
        } else {
          if (password.value == "") confirm.type = "password";
          eye2.textContent = "👁";
        }
      }

      document
        .getElementById("password")
        .addEventListener("input", function () {
          let eye = document.getElementById("eye");
          if (this.value.length > 0) {
            eye.style.display = "inline";
          } else {
            eye.style.display = "none";
            this.type = "password";
            eye.textContent = "👁";
          }
        });

      document.getElementById("confirm").addEventListener("input", function () {
        let eye2 = document.getElementById("eye2");
        if (this.value.length > 0) {
          eye2.style.display = "inline";
        } else {
          eye2.style.display = "none";
          this.type = "password";
          eye2.textContent = "👁";
        }
      });
    </script>
  </body>
</html>
