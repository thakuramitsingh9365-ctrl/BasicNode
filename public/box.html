<!DOCTYPE html>
<html>
<head>
<style>

.box {
    width: 100%;
    height: 250px;
    border: 2px solid black;
    display: flex;
}

.left {
    width: 80%;
  }

.right {
    width: 20%;
    display: flex;
    flex-direction: column;    
    justify-content: space-evenly;
    align-items: center;
    background-color: aqua;

}

.row {
    display: flex;
    height: 33.33%;
 }

.item {
    flex: 1;
    border: 1px solid black;

}

.abc-box {
    width: 40px;
    height: 50px;
    border: 2px solid black;
     
    display: flex;
    justify-content: center;
    align-items: center;
}

</style>
</head>

<body>

<div class="box">

    <div class="left">

        <div style="background-color: blue;" class="row">
            <div class="item"></div>
        </div>

        <div class="row">
            <div style="background-color: blueviolet;" class="item"></div>
            <div style="background-color: brown;" class="item"></div>
        </div>

        <div class="row">
            <div style="background-color: burlywood;" class="item"></div>
            <div style="background-color: black;" class="item"></div>
            <div style="background-color: chocolate;" class="item"></div>
        </div>

    </div>

    <div class="right">

        <div class="abc-box">A</div>
        <div class="abc-box">B</div>
        <div class="abc-box">C</div>

    </div>

</div>

</body>
</html>
