<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100%;
            height: 300px;
            border: 2px solid black;
         
        }

        .row1{
            display: flex;
            height: 30%;
        }

        .row1 .box1 {
            width: 20%;
            border: 1px solid black;
        }

        .row1 .box2{
            width: 50%;
            border: 1px solid black;
        }

        .row1 .box3{
            width: 30%;
            border: 1px solid black;
        }

        .row2{
            display: flex;
            height: 40%;
        }

        .row2 .box1{
            width: 40%;
            border: 1px solid black;
        }

        .row2 .box2{
            width: 20%;
            border: 1px solid black;
        }

        .row2 .box3{
            width: 40%;
            border: 1px solid black;
        }

        .row3{
            display: flex;
            height: 30%;
        }

        .row3 .box1{
            width: 60%;
            border: 1px solid black;
        }

        .row3 .box2{
            width: 40%;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    
    <div class="box">
   
        <div class="row1">
            <div class="box1">1</div>
            <div class="box2">2</div>
            <div class="box3">3</div>
        </div>

        <div class="box2">
            <div class="box1">4</div>
            <div class="box2">5</div>
            <div class="box3">6</div>
        </div>

        <div class="box3">
            <div class="box1">7</div>
           <div class="box2">8</div>
        </div>
        
    </div>
</body>
</html>
